<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Internet Speed Test | Premium Edition</title>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="premium-tag">
                <i class="fas fa-shield-alt"></i>
                PREMIUM ANALYTICS PRO
            </div>
            <button id="history-btn" class="icon-btn" title="View History">
                <i class="fas fa-history"></i>
            </button>
        </div>

        <div class="speed-meter">
            <div class="gauge-indicator">
                <svg viewBox="0 0 120 120">
                    <circle class="gauge-bg" cx="60" cy="60" r="50" />
                    <circle class="gauge-progress" cx="60" cy="60" r="50" stroke-dasharray="314" stroke-dashoffset="314" />
                </svg>
            </div>
            <div class="speed-meter-circle">
                <div class="speed-value" id="speed-value">0</div>
                <div class="speed-unit">Mbps</div>
            </div>
        </div>
        
        <p class="status" id="status">Ready to analyze network performance</p>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress"></div>
        </div>
        
        <div class="result-grid">
            <div class="result-card">
                <span class="result-label">Download</span>
                <span class="result-value" id="download-speed">0.00</span>
            </div>
            <div class="result-card">
                <span class="result-label">Ping</span>
                <span class="result-value" id="ping-value">-</span>
            </div>
            <div class="result-card">
                <span class="result-label">Jitter</span>
                <span class="result-value" id="jitter-value">-</span>
            </div>
            <div class="result-card">
                <span class="result-label">Quality</span>
                <span class="result-value" id="connection-quality">-</span>
            </div>
        </div>

        <div class="network-info" id="network-info">
            <div class="info-item">
                <i class="fas fa-network-wired"></i>
                <span id="isp-name">Detecting ISP...</span>
            </div>
            <div class="info-item">
                <i class="fas fa-globe"></i>
                <span id="ip-address">Loading IP...</span>
            </div>
        </div>
        
        <button class="test-btn" id="start-test">
            Start Analysis
        </button>

        <div id="history-panel" class="history-panel">
            <div class="history-header">
                <h3>Recent Tests</h3>
                <button id="close-history" class="icon-btn"><i class="fas fa-times"></i></button>
            </div>
            <div id="history-list" class="history-list">
                <!-- History items will be injected here -->
                <p class="empty-history">No tests run yet</p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>

</html>
